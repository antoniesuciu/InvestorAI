[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-ai"
version = "0.1.0"
description = "Local, provenance-preserving SEC EDGAR research collector"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi==0.162.0", "uvicorn==0.54.0"]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
investor-ai = "investor_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
